site_name: BitMake Lab
site_url: https://thinkcreatelearn.co.uk/bitmake
theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.tabs  # Enables the tabbed navigation style for the site
  palette:
    primary: custom # Sets the primary color of the site to a custom color defined in the extra.css file
    accent: custom # Sets the accent color of the site to a custom color defined in the extra.css file
  logo: assets/logo.png
  font:
    text: Work Sans

# Site navigation structure
nav:
  - Introduction: 
    - Overview: introduction/index.md
  - Projects: 
    - Overview: projects/index.md
    - Microbit:
      - Overview: projects/microbit/index.md
      - Microbit Basics: projects/microbit/microbit-basics/index.md
      - Microbit Expansion: projects/microbit/microbit-expansion/index.md
    - Wheeled Robots:
      - Overview: projects/wheeled-robots/index.md
      - Build a Basic Robot: projects/wheeled-robots/project-1.01/index.md
      - Add Lights to your Robot: projects/wheeled-robots/project-1.02/index.md
      - Add Crash Sensors to your Robot: projects/wheeled-robots/project-1.03/index.md
      - Build a Remote Control Robot: projects/wheeled-robots/project-1.04/index.md
      - Add a Speed Control to your Remote: projects/wheeled-robots/project-1.05/index.md
      - Build a Line Following Robot: projects/wheeled-robots/project-1.06/index.md
      - Build an Obstacle Avoiding Robot: projects/wheeled-robots/project-1.07/index.md  
    - Trains:
      - Overview: projects/trains/index.md
      - Build a Train: projects/trains/project-2.01/index.md
      - Add Lights to your Train: projects/trains/project-2.02/index.md
      - Add Crash Sensors to your Train: projects/trains/project-2.03/index.md
      - Add an Ultrasonic Sensor to your Train: projects/trains/project-2.04/index.md
      - Build a Signalling System for Trains: projects/trains/project-2.05/index.md
    - Steering Robots:
      - Overview: projects/steering-robots/index.md
      - Build a Steering Robot: projects/steering-robots/project-3.01/index.md
    - Handheld Games:
      - Overview: projects/handheld-games/index.md
      - Build a Reaction Game: projects/handheld-games/project-4.01/index.md
      - Build a Colour Reaction Game: projects/handheld-games/project-4.02/index.md
      - Build a Memory Game: projects/handheld-games/project-4.03/index.md
  - Reference: 
    - Overview: reference/index.md
    - Inputs:
      - Overview: reference/inputs/index.md
      - Button: reference/inputs/button/index.md
      - Crash Sensor: reference/inputs/crash-sensor/index.md
      - Potentiometer: reference/inputs/potentiometer/index.md
      - Ultrasonic Sensor: reference/inputs/ultrasonic-sensor/index.md
      - Line Follow Sensor: reference/inputs/line-follow-sensor/index.md
      - Light Sensor: reference/inputs/light-sensor/index.md
      - Joystick: reference/inputs/joystick/index.md
      - Force Sensor: reference/inputs/force-sensor/index.md
      - Bend Sensor: reference/inputs/bend-sensor/index.md
      - Break Beam Sensor: reference/inputs/break-beam-sensor/index.md
      - Colour Sensor: reference/inputs/colour-sensor/index.md
      - Motion Sensor: reference/inputs/motion-sensor/index.md
      - Weather Sensor: reference/inputs/weather-sensor/index.md
      - 5-Button Keypad: reference/inputs/5-button-keypad/index.md
      - 10-Button Keypad: reference/inputs/10-button-keypad/index.md
      - DIY Keypad: reference/inputs/diy-keypad/index.md
      - Soil Moisture Sensor: reference/inputs/soil-moisture-sensor/index.md
      - Contact Switch: reference/inputs/contact-switch/index.md
      - Rotary Encoder: reference/inputs/rotary-encoder-/index.md
      - Tilt Switch: reference/inputs/tilt-switch/index.md
      - On Off Switch: reference/inputs/on-off-switch/index.md
      - Hall Sensor: reference/inputs/hall-sensor/index.md
    - Outputs:
      - Overview: reference/outputs/index.md
      - LED: reference/outputs/led/index.md
      - Numeric LED: reference/outputs/numeric-led/index.md
      - Alphanumeric LED: reference/outputs/alphanumeric-led/index.md
      - 16x2 LCD Display: reference/outputs/16x2-lcd-display/index.md
      - Neopixel Strip: reference/outputs/neopixel-strip/index.md
      - OLED Display: reference/outputs/oled-display/index.md
    - Motors:
      - Overview: reference/motors/index.md
      - DC Motor: reference/motors/dc-motor/index.md
      - Servo Motor: reference/motors/servo-motor/index.md
      - Hobby Stepper Motor: reference/motors/hobby-stepper-motor/index.md
      - Stepper Motor: reference/motors/stepper-motor/index.md
      - DC Motor DRV8833: reference/motors/dc-motor-drv8833/index.md   
      - Solenoid: reference/motors/solenoid/index.md      
    - Working with Data:
      - Overview: reference/working-with-data/index.md
      - Serial output: reference/working-with-data/serial-output/index.md
      - Data logging: reference/working-with-data/data-logging/index.md
    - Extensions: reference/extensions/index.md
  - Make the kit:
      - Overview: make-the-kit/index.md
#  - Blog:
#    - blog/index.md
  - About: about.md  

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

markdown_extensions:
  - attr_list # add attributes to some markdown elements such as images using curly braces
  - md_in_html # allows markdown to be used inside HTML blocks

  # Python markdown extensions for extra functionality
  # https://squidfunk.github.io/mkdocs-material/setup/extensions/python-markdown-extensions/
  - pymdownx.blocks.caption
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  # Social links
  # https://squidfunk.github.io/mkdocs-material/setup/setting-up-the-footer/?h=social#social-links
  social:
    - icon: fontawesome/brands/instagram 
      link: https://www.instagram.com/tcreatelearn/

    - icon: fontawesome/brands/github
      link: https://github.com/lewfer

  generator: false # Hides the "Generated by MkDocs" message in the footer of the site

  # Custom variables for use in the macros plugin
  bmlgithubpages: https://lewfer.github.io/BitMakeLab
  bmlgithub: https://github.com/lewfer/BitMakeLab/tree/main/

plugins:
  - blog # enables the blog functionality for the site https://squidfunk.github.io/mkdocs-material/setup/setting-up-a-blog/
  - search # enables the search box in the top right of the site
  - macros # gives us the ability to use variables and macrosin our markdown files https://mkdocs-macros-plugin.readthedocs.io

exclude_docs: |
  ^*
  _*

